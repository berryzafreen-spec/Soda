<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Probiotic Soda - Batch Tracker</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; color: #333; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        h2 { color: #2c7a7b; }
        .status { font-weight: bold; color: #38a169; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Live Soda Tracker</h2>
        <p><strong>Batch ID:</strong> <span id="batch-id">F34G2</span></p>
        <p><strong>Flavor:</strong> Ginger Turmeric</p>
        <p><strong>Status:</strong> <span class="status">Active & Fresh</span></p>
        <p><strong>Live CFU Count:</strong> 10 Billion CFU</p>
        <p><strong>Activation Date:</strong> <span id="date">Loading...</span></p>
    </div>

    <script>
        // Automatically display current date or scan timestamp
        document.getElementById('date').innerText = new Date().toLocaleDateString();
    </script>

</body>
</html>
