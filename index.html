<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Probiotic Soda - Batch Tracker</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 50%, #c2e9fb 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px; 
            color: #2d3748; 
            box-sizing: border-box;
        }
        .card { 
            background: rgba(255, 255, 255, 0.92); 
            padding: 28px; 
            border-radius: 18px; 
            box-shadow: 0 10px 25px rgba(107, 70, 193, 0.18); 
            border: 2px solid #e9d8fd;
            max-width: 400px; 
            width: 100%;
            text-align: center;
        }
        h2 { 
            background: linear-gradient(90deg, #d53f8c, #805ad5, #3182ce);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 0;
            font-size: 1.6rem;
        }
        p {
            line-height: 1.6;
            margin: 12px 0;
            text-align: left;
        }
        strong {
            color: #553c9a;
        }
        .status { 
            font-weight: bold; 
            color: #d53f8c; 
            background: #fed7e2;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.9rem;
        }
        .music-btn {
            background: linear-gradient(90deg, #d53f8c, #805ad5);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 4px 10px rgba(213, 63, 140, 0.3);
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Live Soda Tracker</h2>
        <p><strong>Batch ID:</strong> <span id="batch-id">F34G2</span></p>
        <p><strong>Flavor:</strong> Original</p>
        <p><strong>Status:</strong> <span class="status">Active & Fresh</span></p>
        <p><strong>Live CFU Count:</strong> 10 Billion CFU</p>
        <p><strong>Activation Date:</strong> <span id="date">Loading...</span></p>
        
        <button class="music-btn" onclick="playSodaSong()">🎵 Play Soda Pop Anthem</button>
    </div>

    <!-- Hidden audio element using a cheerful synthpop/pop beat audio loop -->
    <audio id="sodaSong" loop>
        <source src="https://actions.google.com/sounds/v1/ambiences/coffee_shop.ogg" type="audio/ogg">
    </audio>

    <script>
        // Automatically display current date
        document.getElementById('date').innerText = new Date().toLocaleDateString();

        function playSodaSong() {
            var music = document.getElementById('sodaSong');
            var btn = document.querySelector('.music-btn');
            if (music.paused) {
                music.play();
                btn.innerText = "⏸️ Pause Soda Pop Anthem";
            } else {
                music.pause();
                btn.innerText = "🎵 Play Soda Pop Anthem";
            }
        }
    </script>

</body>
</html>
